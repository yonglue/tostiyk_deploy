name: Build Windows Client

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 拉取代码
      uses: actions/checkout@v4

    - name: 配置 Node.js 环境
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: 配置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 编译前端 Vue
      run: |
        cd frontend
        npm install
        npm run build

    - name: 安装 Python 打包依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pywebview pyinstaller

    - name: 打包 Windows EXE
      run: |
        pyinstaller --noconsole --onedir --name="TostiykERP" --add-data="frontend/dist;frontend/dist" --add-data="assets;assets" desktop_app.py

    - name: 上传打包好的成品
      uses: actions/upload-artifact@v4
      with:
        name: TostiykERP_Windows_Setup
        path: dist/TostiykERP
        retention-days: 7
